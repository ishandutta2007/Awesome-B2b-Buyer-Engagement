<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-bg { fill: url(#subtleGrid); }
    .pulse-orb {
      animation: pulseMotion 8s ease-in-out infinite alternate;
    }
    .flow-wave {
      animation: waveMotion 10s ease-in-out infinite alternate;
    }
    .radar-beam {
      animation: rotateRadar 12s linear infinite;
      transform-origin: 1050px 180px;
    }
    .badge-card {
      transition: all 0.3s ease;
    }

    @keyframes pulseMotion {
      0% { transform: scale(0.9) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.65; }
      100% { transform: scale(0.9) translate(0, 0); opacity: 0.35; }
    }

    @keyframes waveMotion {
      0% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-12px) scaleY(1.05); }
      100% { transform: translateY(0px) scaleY(1); }
    }

    @keyframes rotateRadar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" class="grid-bg" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (placed behind content) -->
  <g class="pulse-orb" opacity="0.4">
    <circle cx="150" cy="80" r="140" fill="#3b82f6" filter="url(#glow)" />
    <circle cx="1060" cy="280" r="160" fill="#8b5cf6" filter="url(#glow)" />
  </g>

  <!-- Interactive Data Flows / Dynamic Lines in Background -->
  <g class="flow-wave" opacity="0.3" stroke="url(#accentCyan)" stroke-width="1.8" fill="none">
    <path d="M -50,290 C 200,240 400,340 700,280 C 950,230 1100,310 1250,270" />
    <path d="M -50,310 C 250,260 450,360 750,300 C 1000,250 1150,330 1250,290" opacity="0.6" />
  </g>

  <!-- Dynamic Radar / Buyer Intent Signal Pulse (Right background) -->
  <g opacity="0.35">
    <circle cx="1050" cy="180" r="100" stroke="#38bdf8" stroke-width="1" fill="none" stroke-dasharray="4,4" />
    <circle cx="1050" cy="180" r="60" stroke="#818cf8" stroke-width="1" fill="none" />
    <circle cx="1050" cy="180" r="25" stroke="#c084fc" stroke-width="1.5" fill="none" />
    <line x1="1050" y1="180" x2="1140" y2="180" class="radar-beam" stroke="url(#accentCyan)" stroke-width="2" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Title & Subtitles strictly on top layer -->
  <g id="foreground-content" transform="translate(80, 0)">
    
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">
        B2B BUYER ENGAGEMENT ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome B2B Buyer Engagement
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">
      Curated Commercial ABM Suites • Open-Source Revenue Engines • Intent Signal Stacks
    </text>

    <!-- Feature Pillars (Pills) in Foreground -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">
          🎯 Account-Based Marketing
        </text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="160" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">
          📡 Intent Intelligence
        </text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(370, 0)">
        <rect width="170" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">
          🔓 Self-Hosted Stacks
        </text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(555, 0)">
        <rect width="165" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">
          🌐 Dynamic Journeys
        </text>
      </g>
    </g>

    <!-- Footer Stats Line -->
    <g transform="translate(0, 298)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
        Updated October 2026 • Verified Pricing Benchmarks • Enterprise &amp; Open-Source Alternatives
      </text>
    </g>

  </g>
</svg>
